<!DOCTYPE html>
<html>
<head>
  <title>QueryMind RAG</title>
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    h2 {
      color: #e94560;
      text-align: center;
      margin-bottom: 4px;
    }
    p.subtitle {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 16px;
    }
    .url-bar {
      background: #16213e;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 12px;
      word-break: break-all;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    #loadBtn {
      background: #e94560;
      color: white;
    }
    #loadBtn:disabled {
      background: #555;
      cursor: not-allowed;
    }
    textarea {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #16213e;
      color: #eee;
      font-size: 13px;
      resize: none;
      box-sizing: border-box;
    }
    #askBtn {
      background: #0f3460;
      color: white;
    }
    #askBtn:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #status {
      font-size: 12px;
      text-align: center;
      margin: 8px 0;
      min-height: 18px;
      color: #4ecca3;
    }
    #answer {
      background: #16213e;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 10px;
      display: none;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h2>🤖 QueryMind</h2>
  <p class="subtitle">Ask anything from this page!</p>

  <div class="url-bar" id="currentUrl">Detecting page...</div>

  <button id="loadBtn">🔍 Load This Page</button>

  <div id="status"></div>

  <textarea id="questionInput" rows="3" placeholder="Ask your question..." style="display:none"></textarea>
  <button id="askBtn" style="display:none">💬 Ask</button>

  <div id="answer"></div>

  <script src="popup.js"></script>
</body>
</html>
